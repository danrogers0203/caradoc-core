    // --- CALCULATION HELPERS ---
    function calculateProjection(stock, customProj = null, years = 5) {
      const p = customProj || stock.proj;
      const t = years;
      
      const revTarget = stock.rev_m * Math.pow(1 + p.rev_cagr / 100, t);
      const netTarget = revTarget * (p.target_margin / 100);
      const capTarget = netTarget * p.exit_pe;
      const sharesTarget = stock.shares * Math.pow(1 + p.share_change_pct / 100, t);
      const targetPrice = sharesTarget > 0 ? (capTarget / sharesTarget) : 0;
      
      const totalReturn = stock.price > 0 ? ((targetPrice - stock.price) / stock.price) : 0;
      const annualizedCAGR = stock.price > 0 && targetPrice > 0 
        ? (Math.pow(targetPrice / stock.price, 1 / t) - 1) * 100 
        : 0;

      // Status
      let status = "FAIR VALUE";
      let statusColor = "text-amber-400 border-amber-500/30 bg-amber-500/10";
      if (annualizedCAGR >= p.hurdle_rate) {
        status = "UNDERVALUED";
        statusColor = "text-emerald-400 border-emerald-500/30 bg-emerald-500/10";
      } else if (annualizedCAGR < 5.0) {
        status = "OVERPRICED";
        statusColor = "text-rose-400 border-rose-500/30 bg-rose-500/10";
      }

      // Year-by-year points
      const trajectory = [];
      for (let y = 0; y <= t; y++) {
        const rev = stock.rev_m * Math.pow(1 + p.rev_cagr / 100, y);
        const net = rev * (p.target_margin / 100);
        const cap = net * p.exit_pe;
        const shs = stock.shares * Math.pow(1 + p.share_change_pct / 100, y);
        const price = shs > 0 ? (cap / shs) : 0;
        trajectory.push({
          year: y,
          rev: Math.round(rev),
          net: Math.round(net),
          cap: Math.round(cap),
          shares: Math.round(shs),
          price: Number(price.toFixed(2))
        });
      }

      return {
        targetPrice: Number(targetPrice.toFixed(2)),
        revTarget: Math.round(revTarget),
        netTarget: Math.round(netTarget),
        capTarget: Math.round(capTarget),
        totalReturn: (totalReturn * 100).toFixed(1),
        annualizedCAGR: annualizedCAGR.toFixed(1),
        status,
        statusColor,
        trajectory
      };
    }

    // --- MODULE 2: 3-STOCK SHOWDOWN MATRIX ---
    function ShowdownView({ stocks }) {
      const [t1, setT1] = useState(stocks[0]?.ticker || "CELH");
      const [t2, setT2] = useState(stocks[1]?.ticker || "NVDA");
      const [t3, setT3] = useState(stocks[2]?.ticker || "UL");

      const s1 = stocks.find(s => s.ticker === t1) || stocks[0];
      const s2 = stocks.find(s => s.ticker === t2) || stocks[1];
      const s3 = stocks.find(s => s.ticker === t3) || stocks[2];

      const metrics = [
        { label: "Current Stock Price", k: "price", format: v => `$${v.toFixed(2)}`, better: 'none' },
        { label: "Market Cap ($M)", k: "cap", custom: s => s.shares * s.price, format: v => `$${Math.round(v).toLocaleString()}M`, better: 'none' },
        { label: "Forward P/E", k: "forward_pe", format: v => `${v}x`, better: 'low' },
        { label: "Forward PEG Ratio", k: "fwd_peg", format: v => `${v}`, better: 'low' },
        { label: "3-Yr Revenue CAGR", k: "rev_cagr_3yr", format: v => `${v}%`, better: 'high' },
        { label: "Gross Profit Margin", k: "gross_margin", format: v => `${v}%`, better: 'high' },
        { label: "Operating Margin", k: "operating_margin", format: v => `${v}%`, better: 'high' },
        { label: "Net Profit Margin (TTM)", k: "net_margin", format: v => `${v}%`, better: 'high' },
        { label: "ROIC (Return on Capital)", k: "roic", format: v => `${v}%`, better: 'high' },
        { label: "Cash & Equivalents ($M)", k: "cash_m", format: v => `$${v}M`, better: 'high' },
        { label: "Total Debt ($M)", k: "debt_m", format: v => `$${v}M`, better: 'low' },
        { label: "Free Cash Flow ($M)", k: "fcf_m", format: v => `$${v}M`, better: 'high' },
        { label: "Dividend Yield", k: "dividend_yield", format: v => `${v}%`, better: 'high' }
      ];

      // Calculate score winners
      let score1 = 0, score2 = 0, score3 = 0;
      metrics.forEach(m => {
        if (m.better === 'none') return;
        const v1 = m.custom ? m.custom(s1) : s1[m.k];
        const v2 = m.custom ? m.custom(s2) : s2[m.k];
        const v3 = m.custom ? m.custom(s3) : s3[m.k];
        const best = m.better === 'high' ? Math.max(v1, v2, v3) : Math.min(v1, v2, v3);
        if (v1 === best) score1++;
        if (v2 === best) score2++;
        if (v3 === best) score3++;
      });

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-lg font-bold text-white tracking-wide">3-STOCK SHOWDOWN MATRIX</h2>
            <p className="text-xs text-slate-400">Head-to-head multi-variable fundamental battle. Green highlights mark category winners.</p>
          </div>

          {/* SCOREBOARD HERO */}
          <div className="grid grid-cols-3 gap-4">
            {[
              { s: s1, set: setT1, score: score1 },
              { s: s2, set: setT2, score: score2 },
              { s: s3, set: setT3, score: score3 }
            ].map(({ s, set, score }, idx) => (
              <div key={idx} className="bg-caradoc-surface border border-caradoc-border p-4 rounded-xl flex flex-col items-center">
                <select
                  value={s.ticker}
                  onChange={(e) => set(e.target.value)}
                  className="bg-caradoc-card border border-caradoc-border text-cyan-400 font-mono font-bold px-3 py-1.5 rounded text-sm mb-2 focus:outline-none focus:border-cyan-500"
                >
                  {stocks.map(st => <option key={st.ticker} value={st.ticker}>{st.ticker} - {st.name}</option>)}
                </select>
                <div className="text-[10px] text-slate-400 uppercase tracking-widest">Category Wins</div>
                <div className="text-2xl font-mono font-extrabold text-white mt-1">
                  {score} <span className="text-xs text-slate-400 font-normal">/ 11</span>
                </div>
              </div>
            ))}
          </div>

          {/* MATRIX TABLE */}
          <div className="bg-caradoc-surface border border-caradoc-border rounded-xl overflow-hidden shadow-xl">
            <table className="w-full text-xs text-left">
              <thead className="bg-caradoc-card/80 border-b border-caradoc-border text-slate-400 uppercase text-[10px] tracking-wider">
                <tr>
                  <th className="p-3.5 pl-5">Metric / Factor</th>
                  <th className="p-3.5 font-mono text-center">{s1.ticker}</th>
                  <th className="p-3.5 font-mono text-center">{s2.ticker}</th>
                  <th className="p-3.5 font-mono text-center">{s3.ticker}</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-caradoc-border/50">
                {metrics.map(m => {
                  const v1 = m.custom ? m.custom(s1) : s1[m.k];
                  const v2 = m.custom ? m.custom(s2) : s2[m.k];
                  const v3 = m.custom ? m.custom(s3) : s3[m.k];
                  const best = m.better === 'none' ? null : (m.better === 'high' ? Math.max(v1, v2, v3) : Math.min(v1, v2, v3));

                  return (
                    <tr key={m.label} className="hover:bg-caradoc-card/40 transition">
                      <td className="p-3.5 pl-5 font-medium text-slate-300">{m.label}</td>
                      <td className={`p-3.5 text-center font-mono ${best !== null && v1 === best ? 'text-emerald-400 font-bold bg-emerald-500/5' : 'text-slate-300'}`}>
                        {m.format(v1)}
                      </td>
                      <td className={`p-3.5 text-center font-mono ${best !== null && v2 === best ? 'text-emerald-400 font-bold bg-emerald-500/5' : 'text-slate-300'}`}>
                        {m.format(v2)}
                      </td>
                      <td className={`p-3.5 text-center font-mono ${best !== null && v3 === best ? 'text-emerald-400 font-bold bg-emerald-500/5' : 'text-slate-300'}`}>
                        {m.format(v3)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- MODULE 3: 5-YEAR VALUATION & PROJECTION ENGINE ---
    function EngineView({ stock, horizon, onChange }) {
      const baseRes = calculateProjection(stock, stock.proj, horizon);
      
      const bullProj = {
        ...stock.proj,
        rev_cagr: stock.proj.rev_cagr + 5,
        target_margin: stock.proj.target_margin + 3,
        exit_pe: stock.proj.exit_pe + 5
      };
      const bullRes = calculateProjection(stock, bullProj, horizon);

      const bearProj = {
        ...stock.proj,
        rev_cagr: Math.max(0, stock.proj.rev_cagr - 6),
        target_margin: Math.max(2, stock.proj.target_margin - 3),
        exit_pe: Math.max(8, stock.proj.exit_pe - 6)
      };
      const bearRes = calculateProjection(stock, bearProj, horizon);

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-end">
            <div>
              <h2 className="text-lg font-bold text-white tracking-wide">5-YEAR VALUATION & PROJECTION ENGINE</h2>
              <p className="text-xs text-slate-400">Model forward intrinsic value, multiple expansion, and annual share buybacks/dilution.</p>
            </div>
            <div className="text-xs font-mono text-cyan-400 bg-cyan-950/60 border border-cyan-500/30 px-3 py-1 rounded">
              Current Base: ${stock.price.toFixed(2)}
            </div>
          </div>

          {/* SCENARIO CARDS */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-caradoc-surface border border-rose-500/30 p-4 rounded-xl">
              <div className="text-[11px] font-mono font-bold text-rose-400 uppercase">Bear Scenario</div>
              <div className="text-2xl font-bold font-mono text-white mt-1">${bearRes.targetPrice}</div>
              <div className="text-[10px] text-slate-400 mt-1">CAGR: <span className="text-rose-400 font-mono font-bold">{bearRes.annualizedCAGR}%</span></div>
            </div>
            <div className="bg-caradoc-surface border border-cyan-500/50 p-4 rounded-xl shadow-lg shadow-cyan-950/40">
              <div className="text-[11px] font-mono font-bold text-cyan-400 uppercase">Base Case Scenario</div>
              <div className="text-2xl font-bold font-mono text-white mt-1">${baseRes.targetPrice}</div>
              <div className="text-[10px] text-slate-400 mt-1">CAGR: <span className="text-cyan-400 font-mono font-bold">{baseRes.annualizedCAGR}%</span></div>
            </div>
            <div className="bg-caradoc-surface border border-emerald-500/30 p-4 rounded-xl">
              <div className="text-[11px] font-mono font-bold text-emerald-400 uppercase">Bull Scenario</div>
              <div className="text-2xl font-bold font-mono text-white mt-1">${bullRes.targetPrice}</div>
              <div className="text-[10px] text-slate-400 mt-1">CAGR: <span className="text-emerald-400 font-mono font-bold">{bullRes.annualizedCAGR}%</span></div>
            </div>
          </div>

          {/* INPUT CONTROLS GRID */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 bg-caradoc-surface border border-caradoc-border p-6 rounded-xl">
            <div className="space-y-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Operational Compounding Sliders</h3>
              
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-400">Expected Annual Revenue CAGR</span>
                  <span className="font-mono text-cyan-400 font-bold">{stock.proj.rev_cagr}%</span>
                </div>
                <input
                  type="range" min="0" max="60" step="1"
                  value={stock.proj.rev_cagr}
                  onChange={(e) => onChange('rev_cagr', e.target.value)}
                  className="w-full accent-cyan-400 cursor-pointer"
                />
              </div>

              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-400">Target Net Profit Margin</span>
                  <span className="font-mono text-cyan-400 font-bold">{stock.proj.target_margin}%</span>
                </div>
                <input
                  type="range" min="2" max="55" step="0.5"
                  value={stock.proj.target_margin}
                  onChange={(e) => onChange('target_margin', e.target.value)}
                  className="w-full accent-cyan-400 cursor-pointer"
                />
              </div>

              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-400">Annual Share Count Change (Negative = Buybacks)</span>
                  <span className="font-mono text-cyan-400 font-bold">{stock.proj.share_change_pct}%</span>
                </div>
                <input
                  type="range" min="-8" max="10" step="0.5"
                  value={stock.proj.share_change_pct}
                  onChange={(e) => onChange('share_change_pct', e.target.value)}
                  className="w-full accent-cyan-400 cursor-pointer"
                />
              </div>
            </div>

            <div className="space-y-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Valuation & Hurdle Targets</h3>
              
              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-400">Target Exit P/E Multiple</span>
                  <span className="font-mono text-cyan-400 font-bold">{stock.proj.exit_pe}x</span>
                </div>
                <input
                  type="range" min="8" max="70" step="1"
                  value={stock.proj.exit_pe}
                  onChange={(e) => onChange('exit_pe', e.target.value)}
                  className="w-full accent-cyan-400 cursor-pointer"
                />
              </div>

              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-400">Required Return Hurdle Rate (Annualized)</span>
                  <span className="font-mono text-cyan-400 font-bold">{stock.proj.hurdle_rate}%</span>
                </div>
                <input
                  type="range" min="5" max="35" step="1"
                  value={stock.proj.hurdle_rate}
                  onChange={(e) => onChange('hurdle_rate', e.target.value)}
                  className="w-full accent-cyan-400 cursor-pointer"
                />
              </div>

              <div className="pt-2 text-[11px] text-slate-400 leading-relaxed bg-caradoc-card p-3 rounded border border-caradoc-border">
                *At <strong>{stock.proj.hurdle_rate}% Hurdle</strong>, your 5-year target price requires reaching 
                <span className="text-cyan-400 font-mono font-bold"> ${(stock.price * Math.pow(1 + stock.proj.hurdle_rate/100, horizon)).toFixed(2)} </span> 
                by Year {horizon}.
              </div>
            </div>
          </div>

          {/* YEAR-BY-YEAR COMPOUNDING TRAJECTORY TABLE */}
          <div className="bg-caradoc-surface border border-caradoc-border rounded-xl overflow-hidden shadow-xl">
            <div className="p-4 border-b border-caradoc-border font-bold text-xs uppercase tracking-wider text-slate-300">
              Annual Compounding Progression (Year 0 → Year {horizon})
            </div>
            <table className="w-full text-xs text-left">
              <thead className="bg-caradoc-card/80 border-b border-caradoc-border text-slate-400 uppercase text-[10px]">
                <tr>
                  <th className="p-3 pl-4">Year</th>
                  <th className="p-3 text-right">Revenue ($M)</th>
                  <th className="p-3 text-right">Net Income ($M)</th>
                  <th className="p-3 text-right">Diluted Shares (M)</th>
                  <th className="p-3 text-right">Market Cap ($M)</th>
                  <th className="p-3 text-right pr-4">Implied Share Price</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-caradoc-border/50 font-mono">
                {baseRes.trajectory.map(row => (
                  <tr key={row.year} className="hover:bg-caradoc-card/30">
                    <td className="p-3 pl-4 font-bold text-cyan-400">Yr {row.year}</td>
                    <td className="p-3 text-right">${row.rev.toLocaleString()}M</td>
                    <td className="p-3 text-right">${row.net.toLocaleString()}M</td>
                    <td className="p-3 text-right">{row.shares}M</td>
                    <td className="p-3 text-right">${row.cap.toLocaleString()}M</td>
                    <td className="p-3 text-right pr-4 font-bold text-white">${row.price.toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- MODULE 4: FINANCIAL BEDROCK (CHARTS) ---
    function ChartsView({ stock }) {
      const revCanvasRef = useRef(null);
      const marginCanvasRef = useRef(null);

      useEffect(() => {
        let revChart, marginChart;
        if (revCanvasRef.current && stock.historical) {
          revChart = new Chart(revCanvasRef.current, {
            type: 'bar',
            data: {
              labels: stock.historical.years,
              datasets: [
                {
                  label: 'Revenue ($M)',
                  data: stock.historical.revenue,
                  backgroundColor: '#06B6D4'
                },
                {
                  label: 'Net Income ($M)',
                  data: stock.historical.netIncome,
                  backgroundColor: '#10B981'
                }
              ]
            },
            options: {
              responsive: true,
              plugins: { legend: { labels: { color: '#94A3B8' } } },
              scales: {
                x: { ticks: { color: '#94A3B8' }, grid: { color: '#232D42' } },
                y: { ticks: { color: '#94A3B8' }, grid: { color: '#232D42' } }
              }
            }
          });
        }

        if (marginCanvasRef.current && stock.historical) {
          marginChart = new Chart(marginCanvasRef.current, {
            type: 'line',
            data: {
              labels: stock.historical.years,
              datasets: [{
                label: 'Gross Profit Margin (%)',
                data: stock.historical.grossMargin,
                borderColor: '#F59E0B',
                backgroundColor: '#F59E0B20',
                fill: true,
                tension: 0.3
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { labels: { color: '#94A3B8' } } },
              scales: {
                x: { ticks: { color: '#94A3B8' }, grid: { color: '#232D42' } },
                y: { ticks: { color: '#94A3B8' }, grid: { color: '#232D42' } }
              }
            }
          });
        }

        return () => {
          if (revChart) revChart.destroy();
          if (marginChart) marginChart.destroy();
        };
      }, [stock]);

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-lg font-bold text-white tracking-wide">FINANCIAL BEDROCK</h2>
            <p className="text-xs text-slate-400">Historical performance trends for {stock.name}.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-caradoc-surface border border-caradoc-border p-5 rounded-xl shadow-lg">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 mb-4">Revenue vs. Net Income ($M)</h3>
              <canvas ref={revCanvasRef}></canvas>
            </div>
            <div className="bg-caradoc-surface border border-caradoc-border p-5 rounded-xl shadow-lg">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 mb-4">Gross Margin Expansion (%)</h3>
              <canvas ref={marginCanvasRef}></canvas>
            </div>
          </div>
        </div>
      );
    }

    // --- MODULE 5: LEAPS STOCK REPLACEMENT CALCULATOR ---
    function LeapsView({ stock, horizon }) {
      const [strike, setStrike] = useState(() => Math.round(stock.price * 0.70));
      const [askPrice, setAskPrice] = useState(() => parseFloat((stock.price * 0.38).toFixed(2)));

      const proj = calculateProjection(stock, stock.proj, horizon);
      const targetStockPrice = proj.targetPrice;

      // LEAPS Math
      const contracts = 1;
      const totalCostLEAPS = askPrice * 100 * contracts;
      const totalCostShares = stock.price * 100 * contracts;
      const capitalSaved = totalCostShares - totalCostLEAPS;
      
      const intrinsicAtTarget = Math.max(0, targetStockPrice - strike);
      const valueAtTarget = intrinsicAtTarget * 100 * contracts;
      const profitLEAPS = valueAtTarget - totalCostLEAPS;
      const returnLEAPS = totalCostLEAPS > 0 ? (profitLEAPS / totalCostLEAPS) * 100 : 0;
      
      const profitShares = (targetStockPrice - stock.price) * 100 * contracts;
      const returnShares = totalCostShares > 0 ? (profitShares / totalCostShares) * 100 : 0;

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-lg font-bold text-white tracking-wide">LEAPS STOCK REPLACEMENT CALCULATOR</h2>
            <p className="text-xs text-slate-400">Model capital efficiency using deep ITM call options against your {horizon}-year target price.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 bg-caradoc-surface border border-caradoc-border p-6 rounded-xl">
            <div className="space-y-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Contract Parameters</h3>
              
              <div>
                <label className="text-xs text-slate-400 block mb-1">Call Strike Price ($)</label>
                <input
                  type="number"
                  value={strike}
                  onChange={(e) => setStrike(parseFloat(e.target.value) || 0)}
                  className="w-full bg-caradoc-card border border-caradoc-border px-3 py-2 rounded text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div>
                <label className="text-xs text-slate-400 block mb-1">Contract Ask Price / Premium ($)</label>
                <input
                  type="number"
                  step="0.05"
                  value={askPrice}
                  onChange={(e) => setAskPrice(parseFloat(e.target.value) || 0)}
                  className="w-full bg-caradoc-card border border-caradoc-border px-3 py-2 rounded text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div className="text-[11px] text-slate-400 bg-caradoc-card p-3 rounded border border-caradoc-border">
                Synced Target Price (Yr {horizon}): <span className="text-cyan-400 font-mono font-bold">${targetStockPrice}</span>
              </div>
            </div>

            {/* RETURN COMPARISON */}
            <div className="bg-caradoc-card border border-caradoc-border p-5 rounded-lg space-y-4 font-mono">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 font-sans">Leverage & Return Showdown</h3>
              
              <div className="grid grid-cols-2 gap-4 pb-3 border-b border-caradoc-border text-center">
                <div>
                  <div className="text-[10px] text-slate-400 font-sans">LEAPS Total Return</div>
                  <div className={`text-xl font-bold mt-1 ${returnLEAPS >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {returnLEAPS.toFixed(1)}%
                  </div>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400 font-sans">Shares Total Return</div>
                  <div className={`text-xl font-bold mt-1 ${returnShares >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {returnShares.toFixed(1)}%
                  </div>
                </div>
              </div>

              <div className="space-y-1.5 text-xs">
                <div className="flex justify-between">
                  <span className="text-slate-400 font-sans">Upfront Outlay:</span>
                  <span className="text-cyan-400">${totalCostLEAPS.toFixed(2)} vs${totalCostShares.toFixed(2)}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400 font-sans">Capital Preserved / Freed:</span>
                  <span className="text-emerald-400 font-bold">${capitalSaved.toFixed(2)}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400 font-sans">Break-Even Stock Price:</span>
                  <span className="text-slate-200">${(strike + askPrice).toFixed(2)}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

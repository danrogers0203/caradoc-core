    // --- CALCULATION HELPERS ---
    function calculateProjection(stock, customProj = null, years = 5) {
      const p = customProj || stock.proj;
      const t = years;
      
      const revTarget = stock.rev_m * Math.pow(1 + p.rev_cagr / 100, t);
      const netTarget = revTarget * (p.target_margin / 100);
      const capTarget = netTarget * p.exit_pe;
      const sharesTarget = stock.shares * Math.pow(1 + p.share_change_pct / 100, t);
      const targetPrice = sharesTarget > 0 ? (capTarget / sharesTarget) : 0;
      
      const totalReturn = stock.price > 0 ? ((targetPrice - stock.price) / stock.price) : 0;
      const annualizedCAGR = stock.price > 0 && targetPrice > 0 
        ? (Math.pow(targetPrice / stock.price, 1 / t) - 1) * 100 
        : 0;

      let status = "FAIR VALUE";
      let statusColor = "text-amber-400 border-amber-500/30 bg-amber-500/10";
      if (annualizedCAGR >= p.hurdle_rate) {
        status = "UNDERVALUED";
        statusColor = "text-emerald-400 border-emerald-500/30 bg-emerald-500/10";
      } else if (annualizedCAGR < 5.0) {
        status = "OVERPRICED";
        statusColor = "text-rose-400 border-rose-500/30 bg-rose-500/10";
      }

      const trajectory = [];
      for (let y = 0; y <= t; y++) {
        const rev = stock.rev_m * Math.pow(1 + p.rev_cagr / 100, y);
        const net = rev * (p.target_margin / 100);
        const cap = net * p.exit_pe;
        const shs = stock.shares * Math.pow(1 + p.share_change_pct / 100, y);
        const price = shs > 0 ? (cap / shs) : 0;
        trajectory.push({
          year: y,
          rev: Math.round(rev),
          net: Math.round(net),
          cap: Math.round(cap),
          shares: Math.round(shs),
          price: Number(price.toFixed(2))
        });
      }

      return {
        targetPrice: Number(targetPrice.toFixed(2)),
        revTarget: Math.round(revTarget),
        netTarget: Math.round(netTarget),
        capTarget: Math.round(capTarget),
        totalReturn: (totalReturn * 100).toFixed(1),
        annualizedCAGR: annualizedCAGR.toFixed(1),
        status,
        statusColor,
        trajectory
      };
    }

    // --- MODULE 2: 3-STOCK SHOWDOWN MATRIX ---
    function ShowdownView({ stocks, horizon }) {
      const [t1, setT1] = useState(stocks[0]?.ticker || "CELH");
      const [t2, setT2] = useState(stocks[1]?.ticker || "NVDA");
      const [t3, setT3] = useState(stocks[2]?.ticker || "UL");

      const s1 = stocks.find(s => s.ticker === t1) || stocks[0];
      const s2 = stocks.find(s => s.ticker === t2) || stocks[1] || stocks[0];
      const s3 = stocks.find(s => s.ticker === t3) || stocks[2] || stocks[0];

      const metrics = [
        { label: `Projected ${horizon}Y CAGR (Base Case)`, custom: s => parseFloat(calculateProjection(s, null, horizon).annualizedCAGR), format: v => `${v.toFixed(1)}%`, better: 'high' },
        { label: "Current Stock Price", k: "price", format: v => `$${v.toFixed(2)}`, better: 'none' },
        { label: "Market Cap ($M)", custom: s => s.shares * s.price, format: v => `$${Math.round(v).toLocaleString()}M`, better: 'none' },
        { label: "Forward P/E", k: "forward_pe", format: v => `${v}x`, better: 'low' },
        { label: "Forward PEG Ratio", k: "fwd_peg", format: v => `${v}`, better: 'low' },
        { label: "3-Yr Revenue CAGR", k: "rev_cagr_3yr", format: v => `${v}%`, better: 'high' },
        { label: "Gross Profit Margin", k: "gross_margin", format: v => `${v}%`, better: 'high' },
        { label: "Operating Margin", k: "operating_margin", format: v => `${v}%`, better: 'high' },
        { label: "Net Profit Margin (TTM)", k: "net_margin", format: v => `${v}%`, better: 'high' },
        { label: "ROIC (Return on Invested Capital)", k: "roic", format: v => `${v}%`, better: 'high' },
        { label: "Cash & Equivalents ($M)", k: "cash_m", format: v => `$${v.toLocaleString()}M`, better: 'high' },
        { label: "Total Debt ($M)", k: "debt_m", format: v => `$${v.toLocaleString()}M`, better: 'low' },
        { label: "Free Cash Flow ($M)", k: "fcf_m", format: v => `$${v.toLocaleString()}M`, better: 'high' },
        { label: "Dividend Yield", k: "dividend_yield", format: v => `${v}%`, better: 'high' }
      ];

      let score1 = 0, score2 = 0, score3 = 0;
      metrics.forEach(m => {
        if (m.better === 'none') return;
        const v1 = m.custom ? m.custom(s1) : s1[m.k];
        const v2 = m.custom ? m.custom(s2) : s2[m.k];
        const v3 = m.custom ? m.custom(s3) : s3[m.k];
        const best = m.better === 'high' ? Math.max(v1, v2, v3) : Math.min(v1, v2, v3);
        if (v1 === best) score1++;
        if (v2 === best) score2++;
        if (v3 === best) score3++;
      });

      const maxWins = Math.max(score1, score2, score3);

      return (
        <div className="space-y-5">
          <div>
            <h2 className="text-base font-bold text-white tracking-wide uppercase">2. 3-Stock Showdown Matrix</h2>
            <p className="text-xs text-slate-400">Select any 3 equities below. Emerald cells denote the strongest fundamental metric in each row.</p>
          </div>

          <div className="grid grid-cols-3 gap-4">
            {[
              { s: s1, set: setT1, score: score1 },
              { s: s2, set: setT2, score: score2 },
              { s: s3, set: setT3, score: score3 }
            ].map(({ s, set, score }, idx) => (
              <div key={idx} className={`bg-caradoc-surface border p-3.5 rounded-xl flex flex-col items-center ${score === maxWins ? 'border-emerald-500/50 bg-emerald-950/10' : 'border-caradoc-border'}`}>
                <select
                  value={s.ticker}
                  onChange={(e) => set(e.target.value)}
                  className="bg-caradoc-card border border-caradoc-border text-cyan-400 font-mono font-bold px-2.5 py-1 rounded text-xs mb-2 focus:outline-none focus:border-cyan-500 w-full text-center"
                >
                  {stocks.map(st => <option key={st.ticker} value={st.ticker}>{st.ticker} — {st.name}</option>)}
                </select>
                <div className="text-[10px] text-slate-400 uppercase tracking-widest">Category Wins</div>
                <div className="text-xl font-mono font-extrabold text-white mt-0.5 flex items-center gap-1.5">
                  <span>{score} / 12</span>
                  {score === maxWins && <span className="text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-1.5 py-0.5 rounded uppercase">Winner</span>}
                </div>
              </div>
            ))}
          </div>

          <div className="bg-caradoc-surface border border-caradoc-border rounded-xl overflow-hidden shadow-xl">
            <table className="w-full text-xs text-left">
              <thead className="bg-caradoc-card/80 border-b border-caradoc-border text-slate-400 uppercase text-[10px] tracking-wider">
                <tr>
                  <th className="p-3 pl-4">Fundamental Metric</th>
                  <th className="p-3 font-mono text-center">{s1.ticker}</th>
                  <th className="p-3 font-mono text-center">{s2.ticker}</th>
                  <th className="p-3 font-mono text-center">{s3.ticker}</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-caradoc-border/50">
                {metrics.map(m => {
                  const v1 = m.custom ? m.custom(s1) : s1[m.k];
                  const v2 = m.custom ? m.custom(s2) : s2[m.k];
                  const v3 = m.custom ? m.custom(s3) : s3[m.k];
                  const best = m.better === 'none' ? null : (m.better === 'high' ? Math.max(v1, v2, v3) : Math.min(v1, v2, v3));

                  return (
                    <tr key={m.label} className="hover:bg-caradoc-card/40 transition">
                      <td className="p-2.5 pl-4 font-medium text-slate-300">{m.label}</td>
                      <td className={`p-2.5 text-center font-mono ${best !== null && v1 === best ? 'text-emerald-400 font-bold bg-emerald-500/10' : 'text-slate-300'}`}>
                        {m.format(v1)}
                      </td>
                      <td className={`p-2.5 text-center font-mono ${best !== null && v2 === best ? 'text-emerald-400 font-bold bg-emerald-500/10' : 'text-slate-300'}`}>
                        {m.format(v2)}
                      </td>
                      <td className={`p-2.5 text-center font-mono ${best !== null && v3 === best ? 'text-emerald-400 font-bold bg-emerald-500/10' : 'text-slate-300'}`}>
                        {m.format(v3)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- MODULE 3: 5-YEAR VALUATION & PROJECTION ENGINE ---
    function EngineView({ stock, horizon, onChange, onBaselineChange }) {
      const curveCanvasRef = useRef(null);

      const baseRes = calculateProjection(stock, stock.proj, horizon);
      
      const bullProj = {

        rev_cagr: stock.proj.rev_cagr + 5,
        target_margin: stock.proj.target_margin + 3,
        exit_pe: stock.proj.exit_pe + 5
      };
      const bullRes = calculateProjection(stock, bullProj, horizon);

      const bearProj = {
        ...stock.proj,
        rev_cagr: Math.max(0, stock.proj.rev_cagr - 6),
        target_margin: Math.max(2, stock.proj.target_margin - 3),
        exit_pe: Math.max(8, stock.proj.exit_pe - 6)

      const bearRes = calculateProjection(stock, bearProj, horizon);

      useEffect(() => {
        let chartInstance;
        if (curveCanvasRef.current) {
          chartInstance = new Chart(curveCanvasRef.current, {
            type: 'line',
            data: {
              labels: baseRes.trajectory.map(r => `Year ${r.year}`),
              datasets: [
                {
                  label: 'Bull Case ($)',
                  data: bullRes.trajectory.map(r => r.price),
                  borderColor: '#10B981',
                  backgroundColor: '#10B98115',
                  tension: 0.3,
                  borderDash: [4, 4]
                },
                {
                  label: 'Base Case ($)',

                  borderColor: '#06B6D4',
                  backgroundColor: '#06B6D425',
                  fill: true,

                  borderWidth: 3

                  backgroundColor: '#F43F5E10',

                  borderDash: [4, 4]

            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: '#94A3B8', font: { size: 11 } } } },

              <span className="text-slate-600">|</span>
              <span className="text-slate-400">Shares: <strong className="text-white">{stock.shares.toLocaleString()}M</strong></span>
            </div>
          </div>

          {/* SCENARIO CARDS */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-caradoc-surface border border-rose-500/30 p-4 rounded-xl">
              <div className="flex justify-between items-center">
                <span className="text-[10px] font-mono font-bold text-rose-400 uppercase">Bear Case (Yr {horizon})</span>
                <span className="text-[10px] font-mono text-rose-300">{bearProj.rev_cagr}% Growth | {bearProj.exit_pe}x P/E</span>
              </div>
              <div className="text-2xl font-bold font-mono text-white mt-1">${bearRes.targetPrice}</div>
              <div className="text-[11px] text-slate-400 mt-0.5">Annualized CAGR: <span className="text-rose-400 font-mono font-bold">{bearRes.annualizedCAGR}%</span></div>
            </div>

            <div className="bg-caradoc-surface border border-cyan-500/60 p-4 rounded-xl shadow-lg shadow-cyan-950/30">
              <div className="flex justify-between items-center">
                <span className="text-[10px] font-mono font-bold text-cyan-400 uppercase">Base Case (Yr {horizon})</span>
                <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded border ${baseRes.statusColor}`}>{baseRes.status}</span>
              </div>
              <div className="text-2xl font-bold font-mono text-white mt-1">${baseRes.targetPrice}</div>
              <div className="text-[11px] text-slate-400 mt-0.5">Annualized CAGR: <span className="text-cyan-400 font-mono font-bold">{baseRes.annualizedCAGR}%</span> ({baseRes.totalReturn}% Total)</div>

                <input
                  type="range" min="6" max="30" step="1"
                  value={stock.proj.hurdle_rate}
                  onChange={(e) => onChange('hurdle_rate', e.target.value)}
                  className="w-full accent-cyan-400 cursor-pointer"
                />
              </div>
            </div>

            <div className="lg:col-span-7 bg-caradoc-surface border border-caradoc-border p-5 rounded-xl flex flex-col justify-between">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                {horizon}-Year Share Price Trajectory (Bull vs. Base vs. Bear)
              </h3>
              <div className="h-64 w-full">
                <canvas ref={curveCanvasRef}></canvas>
              </div>
            </div>
          </div>

          {/* YEAR-BY-YEAR TABLE */}
          <div className="bg-caradoc-surface border border-caradoc-border rounded-xl overflow-hidden shadow-xl">
            <div className="p-3.5 border-b border-caradoc-border font-bold text-xs uppercase tracking-wider text-slate-300 flex justify-between">
              <span>Year-by-Year Compounding Schedule (Year 0 → Year {horizon})</span>
              <span className="text-cyan-400 font-mono">Base Case Trajectory</span>
            </div>
            <table className="w-full text-xs text-left">
              <thead className="bg-caradoc-card/80 border-b border-caradoc-border text-slate-400 uppercase text-[10px]">
                <tr>
                  <th className="p-2.5 pl-4">Year</th>
                  <th className="p-2.5 text-right">Projected Revenue ($M)</th>
                  <th className="p-2.5 text-right">Projected Net Income ($M)</th>
                  <th className="p-2.5 text-right">Diluted Shares (M)</th>
                  <th className="p-2.5 text-right">Implied Market Cap ($M)</th>
                  <th className="p-2.5 text-right pr-4">Implied Share Price</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-caradoc-border/50 font-mono">
                {baseRes.trajectory.map(row => (
                  <tr key={row.year} className={`hover:bg-caradoc-card/30 ${row.year === 3 || row.year === 5 ? 'bg-cyan-500/5' : ''}`}>
                    <td className="p-2.5 pl-4 font-bold text-cyan-400">
                      Yr {row.year} {row.year === 3 ? '(3Y)' : row.year === 5 ? '(5Y Target)' : ''}
                    </td>
                    <td className="p-2.5 text-right">${row.rev.toLocaleString()}M</td>
                    <td className="p-2.5 text-right">${row.net.toLocaleString()}M</td>
                    <td className="p-2.5 text-right">{row.shares.toLocaleString()}M</td>
                    <td className="p-2.5 text-right">${row.cap.toLocaleString()}M</td>
                    <td className="p-2.5 text-right pr-4 font-bold text-white">${row.price.toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- MODULE 4: FINANCIAL BEDROCK (CHARTS) ---
    function ChartsView({ stock }) {
      const revCanvasRef = useRef(null);
      const marginCanvasRef = useRef(null);

      useEffect(() => {
        let revChart, marginChart;
        if (revCanvasRef.current && stock.historical) {
          revChart = new Chart(revCanvasRef.current, {
            type: 'bar',
            data: {
              labels: stock.historical.years,
              datasets: [
                { label: 'Revenue ($M)', data: stock.historical.revenue, backgroundColor: '#06B6D4' },
                { label: 'Net Income ($M)', data: stock.historical.netIncome, backgroundColor: '#10B981' }
              ]
            },
            options: {
              responsive: true,
              plugins: { legend: { labels: { color: '#94A3B8' } } },
              scales: {
                x: { ticks: { color: '#94A3B8' }, grid: { color: '#232D42' } },
                y: { ticks: { color: '#94A3B8' }, grid: { color: '#232D42' } }
              }
            }
          });
        }

        if (marginCanvasRef.current && stock.historical) {
          marginChart = new Chart(marginCanvasRef.current, {
            type: 'line',
            data: {
              labels: stock.historical.years,
              datasets: [{
                label: 'Gross Profit Margin (%)',
                data: stock.historical.grossMargin,
                borderColor: '#F59E0B',
                backgroundColor: '#F59E0B20',
                fill: true,
                tension: 0.3
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { labels: { color: '#94A3B8' } } },
              scales: {
                x: { ticks: { color: '#94A3B8' }, grid: { color: '#232D42' } },
                y: { ticks: { color: '#94A3B8' }, grid: { color: '#232D42' } }
              }
            }
          });
        }

        return () => {
          if (revChart) revChart.destroy();
          if (marginChart) marginChart.destroy();
        };
      }, [stock]);

      return (
        <div className="space-y-5">
          <div>
            <h2 className="text-base font-bold text-white tracking-wide uppercase">4. Financial Bedrock ({stock.ticker})</h2>
            <p className="text-xs text-slate-400">Multi-year historical revenue scaling, profitability, and balance sheet fortress metrics.</p>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 font-mono">
            <div className="bg-caradoc-surface border border-caradoc-border p-3.5 rounded-xl">
              <div className="text-[10px] text-slate-400 uppercase">Cash & Equivalents</div>
              <div className="text-base font-bold text-emerald-400 mt-0.5">${stock.cash_m.toLocaleString()}M</div>
            </div>
            <div className="bg-caradoc-surface border border-caradoc-border p-3.5 rounded-xl">
              <div className="text-[10px] text-slate-400 uppercase">Total Debt</div>
              <div className="text-base font-bold text-rose-400 mt-0.5">${stock.debt_m.toLocaleString()}M</div>
            </div>
            <div className="bg-caradoc-surface border border-caradoc-border p-3.5 rounded-xl">
              <div className="text-[10px] text-slate-400 uppercase">Free Cash Flow</div>
              <div className="text-base font-bold text-cyan-400 mt-0.5">${stock.fcf_m.toLocaleString()}M</div>
            </div>
            <div className="bg-caradoc-surface border border-caradoc-border p-3.5 rounded-xl">
              <div className="text-[10px] text-slate-400 uppercase">Return on Capital (ROIC)</div>
              <div className="text-base font-bold text-amber-400 mt-0.5">{stock.roic}%</div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div className="bg-caradoc-surface border border-caradoc-border p-4 rounded-xl shadow-lg">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 mb-3">5-Year Revenue vs. Net Income ($M)</h3>
              <canvas ref={revCanvasRef}></canvas>
            </div>
            <div className="bg-caradoc-surface border border-caradoc-border p-4 rounded-xl shadow-lg">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 mb-3">Gross Margin Trajectory (%)</h3>
              <canvas ref={marginCanvasRef}></canvas>
            </div>
          </div>
        </div>
      );
    }

    // --- MODULE 5: LEAPS STOCK REPLACEMENT + CASH YIELD CALCULATOR ---
    function LeapsView({ stock, horizon }) {
      const [strike, setStrike] = useState(20);
      const [askPrice, setAskPrice] = useState(9.51);
      const [cashYieldPct, setCashYieldPct] = useState(4.75);

      useEffect(() => {
        if (stock.ticker === "CELH") {
          setStrike(20);
          setAskPrice(9.51);
        } else {
          setStrike(Math.round(stock.price * 0.65));
          setAskPrice(Number((stock.price * 0.40).toFixed(2)));
        }
      }, [stock.ticker, stock.price]);

      const proj = calculateProjection(stock, stock.proj, horizon);
      const targetStockPrice = proj.targetPrice;

      const totalCostLEAPS = askPrice * 100;
      const totalCostShares = stock.price * 100;
      const capitalSaved = Math.max(0, totalCostShares - totalCostLEAPS);
      
      const intrinsicAtTarget = Math.max(0, targetStockPrice - strike);
      const valueAtTarget = intrinsicAtTarget * 100;
      const profitLEAPS = valueAtTarget - totalCostLEAPS;
      const returnLEAPS = totalCostLEAPS > 0 ? (profitLEAPS / totalCostLEAPS) * 100 : 0;

      const cashInterestEarned = capitalSaved * (Math.pow(1 + cashYieldPct / 100, 2) - 1);
      const combinedProfit = profitLEAPS + cashInterestEarned;
      
      const profitShares = (targetStockPrice - stock.price) * 100;
      const returnShares = totalCostShares > 0 ? (profitShares / totalCostShares) * 100 : 0;

      return (
        <div className="space-y-5">
          <div>
            <h2 className="text-base font-bold text-white tracking-wide uppercase">5. LEAPS Stock Replacement & Cash Yield Engine</h2>
            <p className="text-xs text-slate-400">Compare owning 100 shares outright vs. controlling 100 shares via a deep ITM LEAPS Call + earning yield on freed cash.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 bg-caradoc-surface border border-caradoc-border p-5 rounded-xl">
            <div className="space-y-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-400">LEAPS Contract & Savings Yield Inputs</h3>
              
              <div>
                <label className="text-xs text-slate-300 block mb-1">Deep ITM Call Strike Price ($)</label>
                <input
                  type="number"
                  value={strike}
                  onChange={(e) => setStrike(parseFloat(e.target.value) || 0)}
                  className="w-full bg-caradoc-card border border-caradoc-border px-3 py-2 rounded text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div>
                <label className="text-xs text-slate-300 block mb-1">Option Ask / Entry Premium ($ per share)</label>
                <input
                  type="number"
                  step="0.05"
                  value={askPrice}
                  onChange={(e) => setAskPrice(parseFloat(e.target.value) || 0)}
                  className="w-full bg-caradoc-card border border-caradoc-border px-3 py-2 rounded text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-500"
                />
              </div>

              <div>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-slate-300">Yield on Freed Capital (% APY in Cash/Savings)</span>
                  <span className="font-mono text-emerald-400 font-bold">{cashYieldPct}%</span>
                </div>
                <input
                  type="range" min="0" max="10" step="0.25"
                  value={cashYieldPct}
                  onChange={(e) => setCashYieldPct(parseFloat(e.target.value) || 0)}
                  className="w-full accent-emerald-400 cursor-pointer"
                />
              </div>

              <div className="text-[11px] text-slate-400 bg-caradoc-card p-3 rounded border border-caradoc-border flex justify-between">
                <span>Synced {horizon}Y Target Price:</span>
                <span className="text-cyan-400 font-mono font-bold">${targetStockPrice}</span>
              </div>
            </div>

            <div className="bg-caradoc-card border border-caradoc-border p-5 rounded-lg space-y-4 font-mono">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 font-sans">Capital Efficiency Showdown (100 Shares Controlled)</h3>
              
              <div className="grid grid-cols-2 gap-3 pb-3 border-b border-caradoc-border text-center">
                <div className="bg-caradoc-surface p-3 rounded border border-cyan-500/30">
                  <div className="text-[10px] text-slate-400 font-sans">LEAPS Return on Capital</div>
                  <div className={`text-xl font-bold mt-1 ${returnLEAPS >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {returnLEAPS.toFixed(1)}%
                  </div>
                  <div className="text-[10px] text-slate-400 mt-0.5">+${profitLEAPS.toFixed(0)} Profit</div>
                </div>
                <div className="bg-caradoc-surface p-3 rounded border border-caradoc-border">
                  <div className="text-[10px] text-slate-400 font-sans">100 Shares Outright Return</div>
                  <div className={`text-xl font-bold mt-1 ${returnShares >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {returnShares.toFixed(1)}%
                  </div>
                  <div className="text-[10px] text-slate-400 mt-0.5">+${profitShares.toFixed(0)} Profit</div>
                </div>
              </div>

              <div className="space-y-2 text-xs">
                <div className="flex justify-between">
                  <span className="text-slate-400 font-sans">Capital Required (LEAPS vs Shares):</span>
                  <span className="text-cyan-400">${totalCostLEAPS.toFixed(0)} vs${totalCostShares.toFixed(0)}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400 font-sans">Freed Cash Reserved:</span>
                  <span className="text-emerald-400 font-bold">${capitalSaved.toFixed(2)}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400 font-sans">2-Yr Interest Earned on Freed Cash ({cashYieldPct}%):</span>
                  <span className="text-emerald-400">+${cashInterestEarned.toFixed(2)}</span>
                </div>
                <div className="flex justify-between pt-1 border-t border-caradoc-border/60">
                  <span className="text-slate-200 font-sans font-semibold">True Break-Even Share Price:</span>
                  <span className="text-amber-400 font-bold">${(strike + askPrice).toFixed(2)}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
